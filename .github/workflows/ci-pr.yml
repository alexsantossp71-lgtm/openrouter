name: CI — Validar PR

on:
  pull_request:
    branches:
      - main
      - arena/019fe3dd-openrouter

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m py_compile app.py

      - name: Lint básico
        run: |
          pip install flake8
          flake8 app.py --max-line-length=120 --ignore=E501 --statistics || true

      - name: Validar Dockerfile
        run: docker build -t ai-image-gen:test .

      - name: ✅ Status
        run: echo "## ✅ Validação concluída com sucesso" >> $GITHUB_STEP_SUMMARY
