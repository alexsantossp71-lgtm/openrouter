# =============================================================================
# Deploy Avançado para Render — com Staging, Health Check e Notifications
# =============================================================================
# Nota: o Render não tem rollback via API. Se o health check falhar,
#       apenas notifica o incidente (rollback manual pelo dashboard).
# =============================================================================

name: 🟢 Deploy Avançado Render

on:
    push:
        branches:
            - main
            - arena/019fe3dd-openrouter
            - feat/*
            - fix/*
            - release/*

    workflow_dispatch:
        inputs:
            branch:
                description: "Branch para deploy"
                required: true
                default: "main"
                type: choice
                options:
                    - main
                    - arena/019fe3dd-openrouter
                    - develop
            environment:
                description: "Ambiente de deploy"
                required: true
                default: "staging"
                type: choice
                options:
                    - staging
                    - production

env:
    REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    HEALTHCHECK_RETRIES: 5
    HEALTHCHECK_INTERVAL: 10

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            sha_short: ${{ steps.vars.outputs.sha_short }}
            branch: ${{ github.ref_name }}
            actor: ${{ github.actor }}
            commit_msg: ${{ steps.vars.outputs.commit_msg }}

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🐍 Python setup
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: 📦 Instalar e validar
              run: |
                  pip install -r requirements.txt flake8
                  flake8 app.py --max-line-length=120 --ignore=E501,W503 || true
                  python -m py_compile app.py
                  docker build -t ai-image-gen:validate .

            - name: 📊 Variáveis do commit
              id: vars
              run: |
                  echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "commit_msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

    deploy:
        runs-on: ubuntu-latest
        needs: [validate]
        outputs:
            environment: ${{ steps.config.outputs.environment }}
            service_url: ${{ steps.config.outputs.service_url }}

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: ⚙️ Configurar ambiente
              id: config
              run: |
                  ENV="${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}"

                  if [[ "$ENV" == "production" ]]; then
                      SERVICE_ID="${{ secrets.RENDER_SERVICE_ID }}"
                      URL="https://${SERVICE_ID}.onrender.com"
                  else
                      SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID }}"
                      URL="https://${SERVICE_ID}-staging.onrender.com"
                  fi

                  echo "environment=${ENV}" >> $GITHUB_OUTPUT
                  echo "service_url=${URL}" >> $GITHUB_OUTPUT
                  echo "Service: ${SERVICE_ID} | URL: ${URL}"

            - name: 🚀 Trigger deploy no Render
              run: |
                  # Extrai o ID do serviço da URL
                  SERVICE_ID="${{ steps.config.outputs.service_url }}"
                  clean_id=$(echo "$SERVICE_ID" | sed 's|https://||;s|.onrender.com||;s|-staging||')
                  API_KEY="${{ secrets.RENDER_API_KEY }}"

                  echo "Triggerando deploy no Render (${clean_id})..."

                  RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                      "https://api.render.com/v1/services/${clean_id}/deploys" \
                      -H "Authorization: Bearer ${API_KEY}" \
                      -H "Content-Type: application/json" \
                      -d '{"clearCache": false}')

                  HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                  if [[ "$HTTP_CODE" == "201" || "$HTTP_CODE" == "200" ]]; then
                      echo "✅ Deploy triggerado com sucesso!"
                  else
                      echo "❌ Falha (HTTP ${HTTP_CODE})"
                      echo "$RESPONSE" | sed '$d'
                      exit 1
                  fi

    healthcheck:
        runs-on: ubuntu-latest
        needs: [deploy]
        if: always() && needs.deploy.result != 'skipped'
        outputs:
            status: ${{ steps.check.outputs.status }}

        steps:
            - name: 🩺 Health check
              id: check
              run: |
                  URL="${{ needs.deploy.outputs.service_url }}/health"
                  SUCCESS=false

                  for i in $(seq 1 ${{ env.HEALTHCHECK_RETRIES }}); do
                      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${URL}" || echo "000")

                      if [[ "$HTTP_CODE" == "200" ]]; then
                          echo "✅ Serviço saudável (HTTP ${HTTP_CODE})"
                          SUCCESS=true
                          break
                      fi

                      echo "   Tentativa ${i}/${{ env.HEALTHCHECK_RETRIES }}: HTTP ${HTTP_CODE}"
                      [[ $i -lt ${{ env.HEALTHCHECK_RETRIES }} ]] && sleep ${{ env.HEALTHCHECK_INTERVAL }}
                  done

                  if [[ "$SUCCESS" == "true" ]]; then
                      echo "status=healthy" >> $GITHUB_OUTPUT
                  else
                      echo "status=unhealthy" >> $GITHUB_OUTPUT
                      exit 1
                  fi

    notify:
        runs-on: ubuntu-latest
        needs: [validate, deploy, healthcheck]
        if: always()
        steps:
            - name: 📢 Slack
              if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
              env:
                  WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
              run: |
                  if [[ -z "$WEBHOOK_URL" ]]; then exit 0; fi

                  STATUS="${{ needs.healthcheck.result }}"
                  COLOR="good"; EMOJI="✅"; TEXT="Deploy com sucesso"
                  if [[ "$STATUS" != "success" ]]; then COLOR="danger"; EMOJI="❌"; TEXT="Deploy com problemas"; fi

                  BODY=$(cat <<JSON
                  {
                      "attachments": [{
                          "color": "${COLOR}",
                          "title": "${EMOJI} Render Deploy — ${{ github.repository }}",
                          "text": "${TEXT}",
                          "fields": [
                              {"title": "Ambiente", "value": "${{ needs.deploy.outputs.environment }}", "short": true},
                              {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                              {"title": "Commit", "value": "`${{ needs.validate.outputs.sha_short }}`", "short": false},
                              {"title": "URL", "value": "${{ needs.deploy.outputs.service_url }}", "short": false},
                              {"title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver execução>", "short": true}
                          ],
                          "footer": "AI Image Generator · GitHub Actions",
                          "ts": $(date +%s)
                      }]
                  }
                  JSON
                  )

                  curl -s -X POST -H 'Content-type: application/json' --data "$BODY" "$WEBHOOK_URL" > /dev/null
                  echo "✅ Slack notificado"

            - name: 💬 Discord
              if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
              env:
                  WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              run: |
                  if [[ -z "$WEBHOOK_URL" ]]; then exit 0; fi

                  STATUS="✅"
                  if [[ "${{ needs.healthcheck.result }}" != "success" ]]; then STATUS="❌"; fi

                  BODY=$(cat <<JSON
                  {
                      "content": "${STATUS} **Deploy ${{ needs.healthcheck.result == 'success' && 'concluído' || 'com problemas' }}** — ${{ github.repository }}",
                      "embeds": [{
                          "title": "${{ needs.healthcheck.result == 'success' && 'Deploy OK' || 'Problemas no Deploy' }}",
                          "color": $(( ${{ needs.healthcheck.result == 'success' && '3066993' || '15158332' }} )),
                          "fields": [
                              {"name": "🌿 Ambiente", "value": "${{ needs.deploy.outputs.environment }}", "inline": true},
                              {"name": "🌿 Branch", "value": "${{ github.ref_name }}", "inline": true},
                              {"name": "📝 Commit", "value": "`${{ needs.validate.outputs.sha_short }}`", "inline": false},
                              {"name": "🔗 URL", "value": "${{ needs.deploy.outputs.service_url }}", "inline": false},
                              {"name": "🔗 Workflow", "value": "[Ver execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
                          ],
                          "footer": {"text": "AI Image Generator · GitHub Actions"}
                      }]
                  }
                  JSON
                  )

                  curl -s -X POST -H 'Content-type: application/json' --data "$BODY" "$WEBHOOK_URL" > /dev/null
                  echo "✅ Discord notificado"

    summary:
        runs-on: ubuntu-latest
        needs: [validate, deploy, healthcheck, notify]
        if: always()
        steps:
            - name: 📋 Resumo
              run: |
                  cat <<EOF >> $GITHUB_STEP_SUMMARY
                  # 🟢 Deploy Render — ${{ github.repository }}

                  | Etapa | Status |
                  |-------|--------|
                  | Validação | ${{ needs.validate.result }} |
                  | Deploy | ${{ needs.deploy.result }} |
                  | Health Check | ${{ needs.healthcheck.result }} |
                  | **Ambiente** | **${{ needs.deploy.outputs.environment }}** |

                  **URL do serviço:** ${{ needs.deploy.outputs.service_url }}

                  **Commit:** \`${{ needs.validate.outputs.sha_short }}\` — ${{ needs.validate.outputs.commit_msg }}
                  **Por:** ${{ github.actor }}

                  [Ver execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
                  EOF
