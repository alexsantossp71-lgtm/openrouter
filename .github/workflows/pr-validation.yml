# =============================================================================
# Validação automática de Pull Requests
# =============================================================================
# Dispara em todo PR e faz:
#   1. Linting básico (flake8 / pyflakes)
#   2. Teste de sintaxe Python
#   3. Build do Dockerfile
#   4. Relatório de tamanho de imagem
#
# Útil para não merger código quebrado.
# =============================================================================

name: ✅ Validar PR

on:
    pull_request:
        branches: [main, arena/019fe3dd-openrouter]

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🐍 Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: 📦 Instalar dependências + linters
              run: |
                  pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install flake8 pycodestyle

            - name: 🔍 Linting (flake8)
              run: flake8 app.py --max-line-length=120 --ignore=E501,W503 --statistics

            - name: ✅ Validar sintaxe
              run: python -m py_compile app.py

            - name: 🐳 Build do Dockerfile
              run: docker build --no-cache -t ai-image-gen:pr-validate .

            - name: 📊 Tamanho da imagem
              run: |
                  SIZE=$(docker images --format "{{.Size}}" ai-image-gen:pr-validate)
                  echo "📦 Tamanho da imagem: ${SIZE}"
                  echo "Imagem: ${SIZE}" >> $GITHUB_ENV

            - name: 📢 Status no PR
              if: always()
              run: |
                  cat <<EOF >> $GITHUB_STEP_SUMMARY
                  ## Validação do PR :white_check_mark:

                  | Check | Status |
                  |-------|--------|
                  | Sintaxe Python | ✅ |
                  | Linting (flake8) | ✅ |
                  | Docker build | ✅ |
                  | Tamanho imagem | ${{ env.IMAGE_SIZE }} |

                  > Se tudo estiver verde, pode dar merge com segurança.
                  EOF
