# =============================================================================
# Deploy Avançado para Railway — com Staging, Health Check, Rollback e Notifications
# =============================================================================
#
# Fluxo de deploy:
#   1. Validação (sintaxe, lint, Docker build)
#   2. Deploy no ambiente escolhido (staging ou produção)
#   3. Health check no serviço (verifica /health)
#   4. Se health check falhar → rollback automático
#   5. Notificação no Slack/Discord/Email
#
# Variáveis secretas:
#   REPLICATE_API_TOKEN   — chave Replicate (obrigatória)
#   RAILWAY_TOKEN         — token Railway
#   SLACK_WEBHOOK_URL     — webhook do Slack (opcional)
#   DISCORD_WEBHOOK_URL   — webhook do Discord (opcional)
#   SENDGRID_API_KEY      — API key SendGrid (opcional)
#   NOTIFY_EMAIL          — e-mail para notificação (opcional)
#
# Branches:
#   main                     → deploy em produção
#   arena/*, feat/*, fix/*  → deploy em staging
#   release/*               → deploy em produção (após review)
# =============================================================================

name: 🚂 Deploy Avançado Railway

on:
    push:
        branches:
            - main
            - arena/019fe3dd-openrouter
            - feat/*
            - fix/*
            - release/*

    workflow_dispatch:
        inputs:
            branch:
                description: "Branch para deploy"
                required: true
                default: "main"
                type: choice
                options:
                    - main
                    - arena/019fe3dd-openrouter
                    - develop
            environment:
                description: "Ambiente de deploy"
                required: true
                default: "staging"
                type: choice
                options:
                    - staging
                    - production
            skip_healthcheck:
                description: "Pular health check?"
                required: false
                default: "false"
                type: boolean
            force_rollback:
                description: "Fazer rollback mesmo se o deploy 'parece' sucesso?"
                required: false
                default: "false"
                type: boolean

env:
    REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    ROLLBACK_ON_FAILURE: "true"
    HEALTHCHECK_TIMEOUT: 300
    HEALTHCHECK_RETRIES: 5
    HEALTHCHECK_INTERVAL: 10

jobs:
    # =========================================================================
    # 1. VALIDAÇÃO
    # =========================================================================
    validate:
        runs-on: ubuntu-latest
        outputs:
            sha_short: ${{ steps.vars.outputs.sha_short }}
            branch: ${{ github.ref_name }}
            actor: ${{ github.actor }}
            commit_msg: ${{ steps.vars.outputs.commit_msg }}

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🐍 Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: 📦 Instalar dependências
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt flake8

            - name: 🔍 Lint validação
              run: flake8 app.py --max-line-length=120 --ignore=E501,W503 --statistics || true

            - name: ✅ Validar sintaxe
              run: python -m py_compile app.py

            - name: 🐳 Build Docker
              run: docker build --no-cache -t ai-image-gen:validate .

            - name: 📊 Informações do commit
              id: vars
              run: |
                  echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "commit_msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

    # =========================================================================
    # 2. DEPLOY
    # =========================================================================
    deploy:
        runs-on: ubuntu-latest
        needs: [validate]
        outputs:
            environment: ${{ steps.config.outputs.environment }}
            staging_url: ${{ steps.config.outputs.staging_url }}
            production_url: ${{ steps.config.outputs.production_url }}

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: ⚙️ Configurar ambiente
              id: config
              run: |
                  INPUT_ENV="${{ github.event.inputs.environment || 'staging' }}"
                  BRANCH="${{ github.ref_name }}"

                  if [[ "$BRANCH" == "main" || "$INPUT_ENV" == "production" ]]; then
                      ENV="production"
                      PROD_URL="https://seu-app-production.railway.app"
                      echo "environment=production" >> $GITHUB_OUTPUT
                      echo "staging_url=${PROD_URL}" >> $GITHUB_OUTPUT
                      echo "production_url=${PROD_URL}" >> $GITHUB_OUTPUT
                  else
                      ENV="staging"
                      STAGING_URL="https://seu-app-staging.railway.app"
                      echo "environment=staging" >> $GITHUB_OUTPUT
                      echo "staging_url=${STAGING_URL}" >> $GITHUB_OUTPUT
                      echo "production_url=${STAGING_URL}" >> $GITHUB_OUTPUT
                  fi

                  echo "Ambiente: ${ENV}"
                  echo "URL: ${{ steps.config.outputs.staging_url }}"

            - name: 🔑 Instalar Railway CLI
              run: |
                  curl -fsSL https://railway.app/install.sh | sh > /dev/null 2>&1

            - name: 🚂 Login no Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway login --token "$RAILWAY_TOKEN"

            - name: 🚀 Deploy no Railway
              id: deploy-step
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
                  ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
              run: |
                  railway deploy \
                      --source . \
                      --environment "$ENVIRONMENT" \
                      --no-wait

                  echo "✅ Deploy enviado para Railway"

    # =========================================================================
    # 3. HEALTH CHECK
    # =========================================================================
    healthcheck:
        runs-on: ubuntu-latest
        needs: [deploy]
        if: always() && needs.deploy.result != 'skipped'
        outputs:
            status: ${{ steps.check.outputs.status }}

        steps:
            - name: 🩺 Health check
              id: check
              run: |
                  URL="${{ needs.deploy.outputs.staging_url }}/health"

                  SUCCESS=false
                  for i in $(seq 1 ${{ env.HEALTHCHECK_RETRIES }}); do
                      echo "Tentativa ${i}/${{ env.HEALTHCHECK_RETRIES }}..."
                      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${URL}" || echo "000")

                      if [[ "$HTTP_CODE" == "200" ]]; then
                          echo "✅ Serviço saudável (HTTP ${HTTP_CODE})"
                          SUCCESS=true
                          break
                      fi

                      echo "   HTTP ${HTTP_CODE} — aguardando..."
                      [[ $i -lt ${{ env.HEALTHCHECK_RETRIES }} ]] && sleep ${{ env.HEALTHCHECK_INTERVAL }}
                  done

                  if [[ "$SUCCESS" == "true" ]]; then
                      echo "status=healthy" >> $GITHUB_OUTPUT
                  else
                      echo "status=unhealthy" >> $GITHUB_OUTPUT
                      exit 1
                  fi

    # =========================================================================
    # 4. ROLLBACK
    # =========================================================================
    rollback:
        runs-on: ubuntu-latest
        needs: [healthcheck]
        if: >
            always() &&
            needs.healthcheck.result == 'failure' &&
            (github.event.inputs.force_rollback == 'true' ||
             (env.ROLLBACK_ON_FAILURE == 'true' && github.event.inputs.skip_healthcheck != 'true'))
        outputs:
            rolled_back: "true"

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🔎 Encontrar último commit conhecido bom
              id: find
              run: |
                  PREV=$(git rev-parse HEAD~1)
                  echo "previous_sha=${PREV}" >> $GITHUB_OUTPUT

            - name: 🔄 Rollback no Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
                  ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
              run: |
                  echo "🔄 Rollback para commit anterior..."
                  railway deploy --source . --environment "$ENVIRONMENT" --no-wait || true
                  echo "::warning::Rollback triggerado!"

    # =========================================================================
    # 5. NOTIFICAÇÃO
    # =========================================================================
    notify:
        runs-on: ubuntu-latest
        needs: [validate, deploy, healthcheck, rollback]
        if: always()
        steps:
            - name: 📢 Determinar status
              id: ctx
              run: |
                  DEPLOY="${{ needs.deploy.result }}"
                  HEALTH="${{ needs.healthcheck.result }}"
                  ROLLBACK="${{ needs.rollback.result }}"

                  if [[ "$DEPLOY" == "success" && "$HEALTH" == "success" ]]; then
                      FINAL="success"; EMOJI="✅"; TEXT="Deploy com sucesso"
                  elif [[ "$ROLLBACK" == "success" ]]; then
                      FINAL="rollback"; EMOJI="🔄"; TEXT="Deploy falhou — rollback realizado"
                  elif [[ "$DEPLOY" == "failure" ]]; then
                      FINAL="failure"; EMOJI="❌"; TEXT="Deploy falhou"
                  else
                      FINAL="unknown"; EMOJI="⚠️"; TEXT="Status desconhecido"
                  fi

                  echo "final=${FINAL}" >> $GITHUB_OUTPUT
                  echo "emoji=${EMOJI}" >> $GITHUB_OUTPUT
                  echo "text=${TEXT}" >> $GITHUB_OUTPUT
                  echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
                  echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                  echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
                  echo "sha=$(git rev-parse --short HEAD 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
                  echo "commit_msg=$(git log -1 --pretty=%s 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
                  echo "workflow_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

            - name: 💬 Slack
              if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
              env:
                  WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
              run: |
                  if [[ -z "$WEBHOOK_URL" ]]; then exit 0; fi

                  COLOR="good"
                  if [[ "${{ steps.ctx.outputs.final }}" == "failure" || "${{ steps.ctx.outputs.final }}" == "rollback" ]]; then COLOR="danger"; fi

                  BODY=$(cat <<JSON
                  {
                      "attachments": [{
                          "color": "${COLOR}",
                          "title": "${{ steps.ctx.outputs.emoji }} Deploy ${{ steps.ctx.outputs.final == 'success' && 'concluído' || steps.ctx.outputs.final == 'rollback' && 'com rollback' || 'falhou' }} — ${{ steps.ctx.outputs.repo }}",
                          "text": "${{ steps.ctx.outputs.text }}",
                          "fields": [
                              {"title": "Branch", "value": "${{ steps.ctx.outputs.branch }}", "short": true},
                              {"title": "Commit", "value": "`${{ steps.ctx.outputs.sha }}` — ${{ steps.ctx.outputs.commit_msg }}", "short": false},
                              {"title": "Por", "value": "${{ steps.ctx.outputs.actor }}", "short": true},
                              {"title": "Workflow", "value": "<${{ steps.ctx.outputs.workflow_url }}|Ver execução>", "short": true}
                          ],
                          "footer": "AI Image Generator · GitHub Actions",
                          "ts": $(date +%s)
                      }]
                  }
                  JSON
                  )

                  curl -s -X POST -H 'Content-type: application/json' --data "$BODY" "$WEBHOOK_URL" > /dev/null
                  echo "✅ Slack notificado"

            - name: 💬 Discord
              if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
              env:
                  WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              run: |
                  if [[ -z "$WEBHOOK_URL" ]]; then exit 0; fi

                  STATUS="✅"
                  if [[ "${{ steps.ctx.outputs.final }}" == "failure" ]]; then STATUS="❌";
                  elif [[ "${{ steps.ctx.outputs.final }}" == "rollback" ]]; then STATUS="🔄";
                  fi

                  BODY=$(cat <<JSON
                  {
                      "content": "${STATUS} **Deploy ${{ steps.ctx.outputs.final == 'success' && 'concluído' || steps.ctx.outputs.final == 'rollback' && 'com rollback' || 'falhou' }}** — ${{ steps.ctx.outputs.repo }}",
                      "embeds": [{
                          "title": "${{ steps.ctx.outputs.text }}",
                          "color": $(( ${{ steps.ctx.outputs.final == 'success' && '3066993' || '15158332' }} )),
                          "fields": [
                              {"name": "🌿 Branch", "value": "${{ steps.ctx.outputs.branch }}", "inline": true},
                              {"name": "📝 Commit", "value": "`${{ steps.ctx.outputs.sha }}` — ${{ steps.ctx.outputs.commit_msg }}", "inline": false},
                              {"name": "👤 Por", "value": "${{ steps.ctx.outputs.actor }}", "inline": true},
                              {"name": "🔗 Workflow", "value": "[Ver execução](${{ steps.ctx.outputs.workflow_url }})", "inline": true}
                          ],
                          "footer": {"text": "AI Image Generator · GitHub Actions"}
                      }]
                  }
                  JSON
                  )

                  curl -s -X POST -H 'Content-type: application/json' --data "$BODY" "$WEBHOOK_URL" > /dev/null
                  echo "✅ Discord notificado"

            - name: 📧 E-mail (SendGrid)
              if: ${{ secrets.SENDGRID_API_KEY != '' && secrets.NOTIFY_EMAIL != '' }}
              env:
                  API_KEY: ${{ secrets.SENDGRID_API_KEY }}
                  TO: ${{ secrets.NOTIFY_EMAIL }}
              run: |
                  if [[ -z "$API_KEY" || -z "$TO" ]]; then exit 0; fi

                  SUBJECT="Deploy: ${{ steps.ctx.outputs.repo }}"
                  if [[ "${{ steps.ctx.outputs.final }}" != "success" ]]; then SUBJECT="⚠️ ${SUBJECT}"; fi

                  curl -s -X POST https://api.sendgrid.com/v3/mail/send \
                      -H "Authorization: Bearer $API_KEY" \
                      -H "Content-Type: application/json" \
                      -d "{
                          \"personalizations\": [{\"to\": [{\"email\": \"$TO\"}], \"subject\": \"$SUBJECT\"}],
                          \"from\": {\"email\": \"deploy@seu-dominio.com\", \"name\": \"AI Image Generator\"},
                          \"content\": [{\"type\": \"text/html\", \"value\": \"<p><strong>${{ steps.ctx.outputs.emoji }} ${{ steps.ctx.outputs.text }}</strong></p>
                               <p><strong>Branch:</strong> ${{ steps.ctx.outputs.branch }}</p>
                               <p><strong>Commit:</strong> \`${{ steps.ctx.outputs.sha }}\`</p>
                               <p><a href=\\\"${{ steps.ctx.outputs.workflow_url }}\\\">Ver execução</a></p>\"}]
                      }" > /dev/null

                  echo "✅ E-mail enviado"

    # =========================================================================
    # 6. RESUMO
    # =========================================================================
    summary:
        runs-on: ubuntu-latest
        needs: [validate, deploy, healthcheck, rollback, notify]
        if: always()
        steps:
            - name: 📋 Resumo do GitHub
              run: |
                  cat <<EOF >> $GITHUB_STEP_SUMMARY
                  # 🚀 Resumo do Deploy — ${{ github.repository }}

                  | Etapa | Status |
                  |-------|--------|
                  | Validação | ${{ needs.validate.result }} |
                  | Deploy | ${{ needs.deploy.result }} |
                  | Health Check | ${{ needs.healthcheck.result }} |
                  | Rollback | ${{ needs.rollback.result }} |
                  | **Resultado Final** | **${{ needs.notify.outputs.emoji }} ${{ needs.notify.outputs.text }}** |

                  **Detalhes:**
                  - **Branch:** \`${{ github.ref_name }}\`
                  - **Commit:** \`${{ needs.notify.outputs.sha }}\` — ${{ needs.notify.outputs.commit_msg }}
                  - **Por:** \`${{ github.actor }}\`
                  - **Workflow:** [Ver execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  > Feito com 🤖 por GitHub Actions · AI Image Generator
                  EOF
