<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Imagens AI – Playground v2.5</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* ===== Layout ===== */
        .container {
            max-width: 680px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* ===== Card ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        /* ===== Formulário ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ===== Botões ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition), opacity var(--transition);
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--accent);
            color: #0d1117;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--surface);
            color: var(--text);
        }

        /* ===== Spinner ===== */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Status ===== */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .status.info    { background: rgba(88,166,255,0.1);  color: var(--accent); }
        .status.success { background: rgba(63,185,80,0.1);   color: var(--green); }
        .status.error   { background: rgba(248,81,73,0.1);   color: var(--red); }
        .status.idle    { background: transparent;            color: var(--text-muted); }

        /* ===== Imagem ===== */
        .imagem-container {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .imagem-container img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: block;
        }

        .imagem-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px 20px;
            color: var(--text-muted);
            text-align: center;
        }

        .imagem-placeholder svg {
            opacity: 0.3;
        }

        /* ===== Histórico ===== */
        .historico-titulo {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .historico-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .historico-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color var(--transition);
        }

        .historico-item:hover { border-color: var(--accent); }

        .historico-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .historico-item span {
            font-size: 0.85rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .historico-vazio {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            padding: 12px;
        }

        .acao-limpar {
            margin-top: 10px;
        }

        /* ===== Responsivo ===== */
        @media (max-width: 480px) {
            .row { grid-template-columns: 1fr; }
            header h1 { font-size: 1.5rem; }
            body { padding: 20px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <h1>🎨 Gerador de Imagens AI</h1>
            <p>Playground v2.5 via Replicate · digite um prompt e veja a magia acontecer</p>
        </header>

        <!-- Formulário -->
        <div class="card">
            <form id="form-gerar" class="form-group">
                <div>
                    <label for="prompt">Prompt</label>
                    <input
                        type="text"
                        id="prompt"
                        name="prompt"
                        placeholder="Ex: Um gato astronauta cyberpunk em neon"
                        autocomplete="off"
                        maxlength="1000"
                    >
                </div>

                <div class="row">
                    <div>
                        <label for="width">Largura (px)</label>
                        <input type="number" id="width" name="width" value="1024" min="256" max="2048" step="64">
                    </div>
                    <div>
                        <label for="height">Altura (px)</label>
                        <input type="number" id="height" name="height" value="1024" min="256" max="2048" step="64">
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="steps">Passos (steps)</label>
                        <input type="number" id="steps" name="steps" value="25" min="10" max="100" step="1">
                    </div>
                    <div>
                        <label for="scheduler">Scheduler</label>
                        <select id="scheduler" name="scheduler">
                            <option value="DPMSolver++" selected>DPMSolver++</option>
                            <option value="Euler">Euler</option>
                            <option value="Euler a">Euler a</option>
                            <option value="Heun">Heun</option>
                            <option value="DDIM">DDIM</option>
                            <option value="LCM">LCM</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-enviar">
                    <span id="btn-texto">✨ Gerar Imagem</span>
                    <div class="spinner" id="spinner" style="display:none"></div>
                </button>
            </form>
        </div>

        <!-- Status -->
        <div class="status idle" id="status">
            <span id="status-texto">Pronta para gerar!</span>
        </div>

        <!-- Resultado -->
        <div class="card" id="resultado-card" style="display:none">
            <div class="historico-titulo">Resultado</div>
            <div class="imagem-container">
                <img id="img-resultado" alt="Imagem gerada pela IA">
            </div>
        </div>

        <!-- Placeholder quando não há resultado -->
        <div class="card" id="placeholder-card">
            <div class="imagem-placeholder">
                <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <p>Sua imagem aparecerá aqui</p>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card" id="historico-card" style="display:none">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="historico-titulo" style="margin-bottom:0">Histórico Recente</span>
                <button class="btn btn-secondary" id="btn-limpar" style="padding:6px 12px; font-size:0.8rem">Limpar</button>
            </div>
            <ul class="historico-list" id="historico-list"></ul>
        </div>
    </div>

    <script>
        (function () {
            "use strict";

            // =====================================================================
            // Configuração
            // =====================================================================
            // O backend é descoberto automaticamente via relative URL.
            // Se o frontend e o backend estiverem no mesmo domínio, esse
            // caminho simplesmente funciona. Para separados, configure
            // a variável BACKEND_URL abaixo ou a variável de ambiente
            // correspondente no servidor.
            const BACKEND_URL = window.backendUrl
                || document.querySelector('meta[name="backend-url"]')?.content
                || "/gerar";

            // =====================================================================
            // Estado
            // =====================================================================
            const estado = {
                historico: JSON.parse(localStorage.getItem("ai_historico") || "[]"),
                gerando: false,
            };

            // =====================================================================
            // Referências ao DOM
            // =====================================================================
            const form       = document.getElementById("form-gerar");
            const inputPrompt = document.getElementById("prompt");
            const inputWidth  = document.getElementById("width");
            const inputHeight = document.getElementById("height");
            const inputSteps  = document.getElementById("steps");
            const selectSched = document.getElementById("scheduler");
            const btnEnviar  = document.getElementById("btn-enviar");
            const btnTexto   = document.getElementById("btn-texto");
            const spinner    = document.getElementById("spinner");
            const statusEl   = document.getElementById("status");
            const statusTxt  = document.getElementById("status-texto");
            const imgResult  = document.getElementById("img-resultado");
            const cardResult = document.getElementById("resultado-card");
            const cardPlace  = document.getElementById("placeholder-card");
            const cardHist   = document.getElementById("historico-card");
            const histList   = document.getElementById("historico-list");
            const btnLimpar  = document.getElementById("btn-limpar");

            // =====================================================================
            // Utilitários
            // =====================================================================
            function setStatus(tipo, msg) {
                statusEl.className = "status " + tipo;
                statusTxt.textContent = msg;
            }

            function setGerando(ativar) {
                estado.gerando = ativar;
                btnEnviar.disabled = ativar;
                if (ativar) {
                    spinner.style.display = "";
                    btnTexto.textContent = "Gerando...";
                } else {
                    spinner.style.display = "none";
                    btnTexto.textContent = "✨ Gerar Imagem";
                }
            }

            function mostraResultado(url) {
                cardPlace.style.display = "none";
                cardResult.style.display = "";
                imgResult.src = url;
                imgResult.onload = () => setStatus("success", "✅ Imagem gerada com sucesso!");
                imgResult.onerror = () => setStatus("error", "⚠️ A imagem não carregou. O link pode ter expirado.");
            }

            function escondeResultado() {
                cardResult.style.display = "none";
                cardPlace.style.display = "";
                imgResult.src = "";
            }

            // =====================================================================
            // Histórico
            // =====================================================================
            function renderizaHistorico() {
                if (estado.historico.length === 0) {
                    cardHist.style.display = "none";
                    return;
                }

                cardHist.style.display = "";
                histList.innerHTML = estado.historico
                    .slice() // cópia para não mutar o original durante iteração
                    .reverse()
                    .map((item) => `
                        <li class="historico-item" data-url="${item.url.replace(/"/g, "&quot;")}" data-prompt="${item.prompt.replace(/"/g, "&quot;")}">
                            <img src="${item.url}" alt="thumb" loading="lazy" onerror="this.style.display='none'">
                            <span>${escapeHtml(item.prompt)}</span>
                        </li>
                    `)
                    .join("");

                // Clicar em um item restaura o prompt e mostra a imagem
                histList.querySelectorAll(".historico-item").forEach((li) => {
                    li.addEventListener("click", () => {
                        const url = li.dataset.url;
                        const prompt = li.dataset.prompt;
                        inputPrompt.value = prompt;
                        mostraResultado(url);
                        setStatus("info", `Reproduzindo: ${prompt}`);
                    });
                });
            }

            function adicionaHistorico(prompt, url) {
                // Remover entrada duplicada (mesmo prompt)
                estado.historico = estado.historico.filter((h) => h.prompt !== prompt);
                estado.historico.unshift({ prompt, url, timestamp: Date.now() });
                // Manter no máximo 20 itens
                if (estado.historico.length > 20) estado.historico.pop();
                localStorage.setItem("ai_historico", JSON.stringify(estado.historico));
                renderizaHistorico();
            }

            function limparHistorico() {
                estado.historico = [];
                localStorage.removeItem("ai_historico");
                renderizaHistorico();
                setStatus("info", "Histórico limpo.");
            }

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // =====================================================================
            // Chamada ao backend
            // =====================================================================
            async function gerarImagem(prompt, params) {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, ...params }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.erro || `HTTP ${response.status}: ${response.statusText}`);
                }

                if (!data.url) {
                    throw new Error(data.erro || "Resposta inválida do servidor.");
                }

                return data;
            }

            // =====================================================================
            // Eventos
            // =====================================================================
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const prompt = inputPrompt.value.trim();
                if (!prompt) {
                    setStatus("error", "⚠️ Digite um prompt antes de gerar.");
                    inputPrompt.focus();
                    return;
                }

                const params = {
                    width:  parseInt(inputWidth.value, 10)  || 1024,
                    height: parseInt(inputHeight.value, 10) || 1024,
                    steps:  parseInt(inputSteps.value, 10)  || 25,
                    scheduler: selectSched.value,
                };

                setGerando(true);
                escondeResultado();
                setStatus("info", `🎨 Gerando imagem: "${prompt.slice(0, 60)}${prompt.length > 60 ? "…" : ""}"`);

                try {
                    const data = await gerarImagem(prompt, params);
                    mostraResultado(data.url);
                    adicionaHistorico(prompt, data.url);
                } catch (err) {
                    setStatus("error", "❌ " + err.message);
                    console.error("Erro ao gerar imagem:", err);
                } finally {
                    setGerando(false);
                }
            });

            btnLimpar.addEventListener("click", limparHistorico);

            inputPrompt.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    form.dispatchEvent(new Event("submit"));
                }
            });

            // =====================================================================
            // Inicialização
            // =====================================================================
            renderizaHistorico();

            // Se houver um ?prompt= na URL, pré-preencher
            const paramsURL = new URLSearchParams(window.location.search);
            const promptURL = paramsURL.get("prompt");
            if (promptURL) {
                inputPrompt.value = decodeURIComponent(promptURL);
            }

            console.log(`🔧 Backend URL: ${BACKEND_URL}`);
        })();
    </script>

    <!-- Opcional: definir backendUrl via meta para configuração externa -->
    <!-- <meta name="backend-url" content="https://seu-backend.com/gerar"> -->
</body>
</html>
